<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">

<defs>
<linearGradient id="bg" x2="1" y2="1">
<stop stop-color="#050817"/>
<stop offset="1" stop-color="#131d45"/>
</linearGradient>
</defs>

<rect width="1200" height="700" rx="35" fill="url(#bg)"/>

<!-- sidebar -->
<rect x="40" y="40" width="220" height="620" rx="25" fill="#ffffff10"/>
<text x="80" y="120" fill="white" font-size="38" font-family="Arial" font-weight="bold">AX</text>
<text x="75" y="200" fill="#bfc8ff" font-size="22">Dashboard</text>
<text x="75" y="250" fill="#bfc8ff" font-size="22">Analytics</text>
<text x="75" y="300" fill="#bfc8ff" font-size="22">Journal</text>
<text x="75" y="350" fill="#bfc8ff" font-size="22">Risk</text>
<text x="75" y="400" fill="#00c8ff" font-size="22">AI Coach</text>

<!-- header -->
<rect x="300" y="50" width="820" height="90" rx="20" fill="#ffffff10"/>
<text x="340" y="105" fill="white" font-size="30" font-family="Arial">
AxivoraX Intelligence Dashboard
</text>

<!-- cards -->
<rect x="320" y="180" width="240" height="130" rx="20" fill="#ffffff12"/>
<text x="350" y="230" fill="#bfc8ff" font-size="20">Risk Score</text>
<text x="350" y="280" fill="#00c8ff" font-size="42">Balanced</text>

<rect x="590" y="180" width="240" height="130" rx="20" fill="#ffffff12"/>
<text x="620" y="230" fill="#bfc8ff" font-size="20">Performance</text>
<text x="620" y="280" fill="white" font-size="42">+18%</text>

<rect x="860" y="180" width="240" height="130" rx="20" fill="#ffffff12"/>
<text x="890" y="230" fill="#bfc8ff" font-size="20">AI Insights</text>
<text x="890" y="280" fill="#8b5cff" font-size="42">24</text>

<!-- chart -->
<rect x="320" y="360" width="780" height="230" rx="25" fill="#ffffff08"/>
<polyline points="360,520 480,450 620,490 760,400 950,440 1050,370"
fill="none"
stroke="#00c8ff"
stroke-width="8"/>

<text x="350" y="410" fill="white" font-size="25">
Performance Analytics
</text>

</svg>
