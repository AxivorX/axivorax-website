<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axivorax - Admin Dashboard</title>
    <!-- Include Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
        input, button { padding: 0.75rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Axivorax Admin</h1>

        <!-- Login Section (Shown if not logged in) -->
        <div id="login-section" class="card">
            <h3>Admin Login</h3>
            <form id="login-form">
                <input type="email" id="admin-email" placeholder="Your Email" required><br><br>
                <input type="password" id="admin-password" placeholder="Password" required><br><br>
                <button type="submit">Login</button>
            </form>
            <p id="login-error" style="color: #ef4444;"></p>
        </div>

        <!-- Dashboard Section (Hidden until logged in) -->
        <div id="dashboard-section" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Waitlist Sign-ups</h3>
                <button id="logout-btn" style="background: #ef4444;">Logout</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Asset Type</th>
                        <th>Signed Up</th>
                    </tr>
                </thead>
                <tbody id="waitlist-table-body">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Replace with your actual Supabase details
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const tableBody = document.getElementById('waitlist-table-body');

        // Check if already logged in on page load
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showDashboard();
            }
        }
        checkUser();

        // Handle Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                loginError.textContent = error.message;
            } else {
                showDashboard();
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
        });

        // Fetch and display waitlist data
        async function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');

            // Fetch from your waitlist table (adjust table name if needed, e.g., 'waitlist')
            const { data, error } = await supabase
                .from('waitlist') 
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('Error loading waitlist data: ' + error.message);
                return;
            }

            tableBody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.email}</td>
                    <td>${row.asset_type || 'N/A'}</td>
                    <td>${new Date(row.created_at).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
